const MO=1048576;
const MIMES={mp4:'video/mp4',mov:'video/quicktime',webm:'video/webm',m4v:'video/mp4','3gp':'video/3gpp',mkv:'video/x-matroska',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',amr:'audio/amr',flac:'audio/flac',wma:'audio/x-ms-wma',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',pdf:'application/pdf'};
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
function mimeDe(f){const e=(f.name.split('.').pop()||'').toLowerCase();let m=(f.type||'').toLowerCase();if(!m||m==='application/octet-stream')m=MIMES[e]||'application/octet-stream';return m}
function metaFichier(f,type){
  return new Promise(res=>{
    if(!(type==='video'||type==='reel'||type==='audio'))return res({});
    const url=URL.createObjectURL(f),el=document.createElement(type==='audio'?'audio':'video');
    el.preload='metadata';el.muted=true;el.playsInline=true;
    const fin=o=>{clearTimeout(t);try{URL.revokeObjectURL(url)}catch(e){}res(o||{})};
    const t=setTimeout(()=>fin({}),9000);
    el.onerror=()=>fin({});
    el.onloadedmetadata=()=>{
      const duree=isFinite(el.duration)?Math.round(el.duration):null;
      if(type==='audio')return fin({duree});
      el.onseeked=()=>{try{const w=640,h=Math.max(1,Math.round(w*(el.videoHeight||9)/(el.videoWidth||16))),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(el,0,0,w,h);c.toBlob(b=>fin({duree,cover:b}),'image/jpeg',0.8)}catch(e){fin({duree})}};
      try{el.currentTime=Math.min(1,(el.duration||2)/2)}catch(e){fin({duree})}
    };
    el.src=url;
  });
}
async function envoyerFichier(file,path,mime,onP){
  const std=async()=>{
    let derniere=null;
    for(let essai=0;essai<4;essai++){
      try{
        if(essai)await new Promise(r=>setTimeout(r,2000*essai));
        let corps=file;
        if(file.size<=60*MO){try{corps=new Blob([await file.arrayBuffer()],{type:mime})}catch(e){corps=file}}
        const {error}=await sb.storage.from('yt-media').upload(path,corps,{contentType:mime,upsert:essai>0});
        if(error)throw error;onP(file.size,file.size);return;
      }catch(e){derniere=e;const t=String((e&&e.message)||e);if(/exceeded|maximum allowed size|413|row-level|policy|unauthor/i.test(t))break}
    }
    const t=String((derniere&&derniere.message)||derniere);
    throw new Error(/failed to fetch|network|load failed/i.test(t)?'Connexion coupée ou trop faible. Réessayez avec un meilleur réseau.':t);
  };
  if(file.size<=6*MO)return std();
  if(!window.tus)await new Promise(r=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js';sc.onload=sc.onerror=()=>r();document.head.appendChild(sc)});
  if(!window.tus){if(file.size>50*MO)throw new Error("Outil d'envoi indisponible : rechargez la page.");return std()}
  const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Session expirée : reconnectez-vous.');
  return new Promise((ok,ko)=>{
    const u=new tus.Upload(file,{endpoint:SB_URL+'/storage/v1/upload/resumable',retryDelays:[0,3000,5000,10000,20000],
      headers:{authorization:'Bearer '+session.access_token,apikey:SB_KEY},uploadDataDuringCreation:true,removeFingerprintOnSuccess:true,
      metadata:{bucketName:'yt-media',objectName:path,contentType:mime,cacheControl:'31536000'},chunkSize:6*MO,
      onError:async e=>{if(file.size<=50*MO){try{await std();return ok()}catch(e2){return ko(e2)}}ko(e)},
      onProgress:onP,onSuccess:()=>ok()});
    u.start();
  });
}
function idYoutube(u){const m=/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/.exec(u||'');return m?m[1]:null}

            }
          }
          if(echecs.length){msg('✅ '+faits+' publié(s). ❌ Échecs : '+echecs.join(' | '));btn.disabled=false;return}
        }
        toast('Publié ✓');show();
      }catch(e){
        const t=String((e&&(e.message||e.error))||e);
        msg('Échec : '+(/exceeded|maximum allowed size|413/i.test(t)?"fichier trop gros pour l'espace de stockage (limite Supabase de 50 Mo sur l'offre gratuite).":t));
        btn.disabled=false;
      }
    };
  },

  async notif(m){
    const {data:R,error}=await sb.rpc('push_reglages_lire');if(error)throw error;
    const cats=(R.categories||[]).slice().sort();
    m.innerHTML=`<div class="card"><b>🌅 Lumière du matin</b>
      <p class="mut"><b>${+R.abonnes_jour}</b> appareils reçoivent la Lumière du matin · <b>${+R.abonnes_nouveau}</b> reçoivent les nouveaux prêches (envoyés automatiquement à chaque publication).</p>
      <label style="display:flex;gap:10px;align-items:center;margin:10px 0"><input type="checkbox" id="n-a" style="width:24px;height:24px;margin:0" ${R.actif?'checked':''}> <b>Envoi automatique chaque jour</b></label>
      <label>Heure d'envoi (heure du Cameroun)<input type="time" id="n-h" value="${esc(R.heure)}"></label>
      <label>Quoi envoyer<select id="n-c"><option value="invocation">Hadith / invocation du jour</option><option value="pretche">Le dernier prêche publié</option><option value="message">Mon propre message</option></select></label>
      <div id="n-cat-w"><label>Thème des invocations<select id="n-cat"><option value="">Tous les thèmes</option>${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label></div>
      <div id="n-msg-w"><input id="n-t" maxlength="60" placeholder="Titre" value="${esc(R.titre||'')}"><textarea id="n-m" maxlength="180" placeholder="Message">${esc(R.message||'')}</textarea></div>
      <div class="btns"><button id="n-s" class="b-ok">Enregistrer</button><button id="n-n" class="b-warn">Envoyer maintenant à tous</button></div>
      <p class="mut" id="n-r"></p></div>`;
    const $=i=>document.getElementById(i);
    $('n-c').value=R.contenu;$('n-cat').value=R.categorie||'';
    const maj=()=>{$('n-cat-w').hidden=$('n-c').value!=='invocation';$('n-msg-w').hidden=$('n-c').value!=='message'};
    $('n-c').onchange=maj;maj();
    $('n-s').onclick=async()=>{const r=await sb.rpc('push_reglages_ecrire',{p_actif:$('n-a').checked,p_heure:$('n-h').value||'05:00',p_contenu:$('n-c').value,p_categorie:$('n-cat').value,p_titre:$('n-t').value,p_message:$('n-m').value});
      if(r.error)toast('Erreur : '+r.error.message);else toast('Enregistré ✓')};
    $('n-n').onclick=async()=>{if(!confirm('Envoyer la notification maintenant à tous les abonnés ?'))return;const r=await sb.rpc('push_envoyer_maintenant');
      if(r.error)toast('Erreur : '+r.error.message);else toast('Envoi lancé ✓')};
  },
  async dash(m){
    const {data,error}=await sb.rpc('yt_admin_stats');if(error)throw error;
    const L={utilisateurs:'Utilisateurs',createurs:'Créateurs vérifiés',suspendus_ou_bannis:'Suspendus / bannis',contenus_publies:'Contenus publiés',vues_totales:'Vues totales',abonnements:'Abonnements',signalements_ouverts:'Signalements ouverts',demandes_createur:'Demandes créateur'};
    m.innerHTML='<div class="grid">'+Object.keys(L).map(k=>`<div class="card stat"><b>${esc(data[k])}</b><span>${L[k]}</span></div>`).join('')+'</div>';
  },
  async demandes(m){
    const {data,error}=await sb.rpc('yt_demandes_en_attente');if(error)throw error;
    if(!data.length){m.innerHTML='<div class="empty">Aucune demande en attente.</div>';return}
    m.innerHTML=data.map(d=>`<div class="card"><b>${esc(d.nom||'Sans nom')}</b> <span class="mut">· chaîne « ${esc(d.nom_chaine)} »</span>
      <div class="mut">${fmt(d.cree_le)}</div><p>${esc(d.message||'')}</p>
      <div class="btns"><button class="b-ok" data-a="1" data-u="${esc(d.user_id)}">Accepter</button><button class="b-bad" data-a="0" data-u="${esc(d.user_id)}">Refuser</button></div></div>`).join('');
    m.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.a==='1';if(!confirm(ok?'Accepter ce créateur ?':'Refuser cette demande ?'))return;
      act(()=>sb.rpc('yt_decider_createur',{p_user:b.dataset.u,p_accepter:ok}),ok?'Créateur accepté':'Demande refusée');
    });
  },
  async users(m){
    const {data,error}=await sb.from('yt_users').select('id,full_name,role,statut,created_at').order('created_at',{ascending:false}).limit(500);if(error)throw error;
    m.innerHTML='<input id="q" placeholder="Rechercher un nom…"><div id="list"></div>';
    const draw=()=>{
      const q=slug(document.getElementById('q').value);
      const rows=data.filter(u=>!q||slug(u.full_name||'').includes(q));
      document.getElementById('list').innerHTML=rows.length?rows.map(u=>{
        const cls=u.statut==='actif'?'ok':u.statut==='suspendu'?'warn':'bad';
        const btns=u.role==='admin'?'':[
          u.statut!=='actif'?`<button class="b-ok" data-s="actif" data-u="${esc(u.id)}">Réactiver</button>`:'',
          u.statut!=='suspendu'?`<button class="b-warn" data-s="suspendu" data-u="${esc(u.id)}">Suspendre</button>`:'',
          u.statut!=='banni'?`<button class="b-bad" data-s="banni" data-u="${esc(u.id)}">Bannir</button>`:''].join('');
        return `<div class="card"><div class="row"><b>${esc(u.full_name||'Sans nom')}</b><span class="tag ${cls}">${esc(u.statut)}</span></div>
        <div class="mut">${esc(u.role)} · inscrit ${fmt(u.created_at)}</div><div class="btns">${btns}</div></div>`}).join(''):'<div class="empty">Aucun résultat.</div>';
      document.querySelectorAll('#list button').forEach(b=>b.onclick=()=>{
        if(!confirm('Confirmer : '+b.textContent+' ?'))return;
        act(()=>sb.rpc('yt_admin_statut_user',{p_user:b.dataset.u,p_statut:b.dataset.s}),'Statut mis à jour');
      });
    };
    document.getElementById('q').oninput=draw;draw();
  },
  async contenus(m){
    const f=views._cf||'';
    let q=sb.from('yt_contenus').select('id,title,type,status,views_count,created_at,yt_channels(name)').order('created_at',{ascending:false}).limit(200);
    if(f)q=q.eq('status',f);
    const {data,error}=await q;if(error)throw error;
    m.innerHTML=`<select id="f"><option value="">Tous les statuts</option><option value="published">Publiés</option><option value="processing">En traitement</option><option value="hidden">Masqués</option></select><div id="list"></div>`;
    const sel=document.getElementById('f');sel.value=f;sel.onchange=()=>{views._cf=sel.value;show()};
    document.getElementById('list').innerHTML=data.length?data.map(c=>`<div class="card"><div class="row"><b>${esc(c.title)}</b><span class="tag">${esc(c.status)}</span></div>
      <div class="mut">${esc(c.type)} · ${esc(c.yt_channels?.name||'—')} · ${esc(c.views_count)} vues · ${fmt(c.created_at)}</div>
      <div class="btns">${c.status!=='published'?`<button class="b-ok" data-s="published" data-i="${esc(c.id)}">Publier</button>`:''}${c.status!=='hidden'?`<button class="b-bad" data-s="hidden" data-i="${esc(c.id)}">Masquer</button>`:''}</div></div>`).join(''):'<div class="empty">Aucun contenu.</div>';
    document.querySelectorAll('#list button').forEach(b=>b.onclick=()=>{
      if(!confirm('Confirmer : '+b.textContent+' ?'))return;
      act(()=>sb.rpc('yt_admin_moderer_contenu',{p_id:b.dataset.i,p_status:b.dataset.s}),'Contenu mis à jour');
    });
  },
  async sig(m){
    const {data,error}=await sb.from('yt_signalements').select('id,motif,statut,created_at,yt_contenus(title),yt_comments(content)').eq('statut','ouvert').order('created_at').limit(200);if(error)throw error;
    if(!data.length){m.innerHTML='<div class="empty">Aucun signalement ouvert.</div>';return}
    m.innerHTML=data.map(s=>`<div class="card"><div class="mut">${fmt(s.created_at)}</div>
      <div><b>${s.yt_contenus?'Contenu :':'Commentaire :'}</b> ${esc(s.yt_contenus?.title||s.yt_comments?.content||'(supprimé)')}</div>
      <div>Motif : ${esc(s.motif)}</div>
      <div class="btns"><button class="b-bad" data-a="masquer" data-i="${esc(s.id)}">${s.yt_contenus?'Masquer le contenu':'Supprimer le commentaire'}</button><button class="b-gr" data-a="rejeter" data-i="${esc(s.id)}">Rejeter</button></div></div>`).join('');
    m.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if(!confirm('Confirmer : '+b.textContent+' ?'))return;
      act(()=>sb.rpc('yt_admin_traiter_signalement',{p_id:b.dataset.i,p_action:b.dataset.a}),'Signalement traité');
    });
  },
  async audit(m){
    const {data,error}=await sb.from('yt_audit_logs').select('id,action,cible_type,cible_id,details,created_at,yt_users(full_name)').order('created_at',{ascending:false}).limit(100);if(error)throw error;
    m.innerHTML=data.length?data.map(a=>`<div class="card"><b>${esc(a.action)}</b> <span class="mut">par ${esc(a.yt_users?.full_name||'?')}</span>
      <div class="mut">${esc(a.cible_type)} · ${fmt(a.created_at)}</div><div class="mut">${esc(JSON.stringify(a.details||{}))}</div></div>`).join(''):'<div class="empty">Journal vide.</div>';
  }
};

sb.auth.onAuthStateChange(()=>{});
start();
</script>
</body>
</html>
