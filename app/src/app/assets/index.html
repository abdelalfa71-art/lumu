/* ---------- Présentation / tarifs / palette ---------- */
.ld { --em: #0F7B6C; --em2: #13A58F; padding: 0 0 90px; }
.ld-hero { position: relative; overflow: hidden; padding: 56px 20px 40px; text-align: center; background: radial-gradient(120% 80% at 50% -10%, rgba(19,165,143,.35), transparent 60%), linear-gradient(180deg, #06201B, #0A1223); color: #fff; border-radius: 0 0 28px 28px; }

.ld-cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.ld-t { background: var(--surface); border: 1px solid var(--bordure); border-radius: 20px; padding: 16px; min-height: 130px; display: flex; flex-direction: column; gap: 6px; }

.pal-fond { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: flex-start; padding: 10vh 12px 0; animation: palIn .12s ease-out; }

const PROTEGEES = ["chaine-edit", "notifications", "je-publie", "importer", "espace", "groupe-nouveau", "mes-livres", "livre-edition", "live-nouveau", "publier", "devenir-createur", "admin", "push-admin", "mes-contenus", "choix-enfant", "inscription", "accueil", "lecons", "dialogue", "parametres", "changer-mot-de-passe", "pin-creation", "favoris", "historique", "lien", "playlists", "stats", "abonnements"];
const ROOTS = ["flux", "discussions", "home", "espace", "abos", "profil", "preches", "biblio", "direct"];
function router(route, params = {}, opts = {}) {
  if (!etat.parentId && PROTEGEES.includes(route)) { route = "connexion"; params = { message: "Connectez-vous pour continuer." }; }
  if (etat.envoiEnCours && (etat.route === "publier" || etat.route === "je-publie" || etat.route === "importer") && route !== etat.route) {
    if (!confirm("Un envoi est en cours. Quitter l'annulera. Continuer ?")) return false;
    if (etat.annulerEnvoi) etat.annulerEnvoi();
  }
  if ((route === "flux" || route === "home") && etat.lienChaine) {
    const id = etat.lienChaine; etat.lienChaine = null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {}
    route = "chaine"; params = { id };
  }
  if ((route === "flux" || route === "home") && etat.lienRoute) {
    const r = etat.lienRoute; etat.lienRoute = null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {}
    route = r; params = {};
  }
  if ((route === "flux" || route === "home") && etat.lienEnAttente) {
    const id = etat.lienEnAttente; etat.lienEnAttente = null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {}
    route = "contenu"; params = { id }; if (etat.lienT && etat.lienT > 10) { sauverLocal("pos_" + id, etat.lienT); } etat.lienT = null;
  }
  etat.route = route; etat.params = params;
  if (!opts.depuisPile) {
    if (ROOTS.includes(route) || route === "connexion" || route === "pin-verrou") etat.pile = [{ route, params }];
    else etat.pile.push({ route, params });
    try { history.pushState(null, "", location.pathname + location.search); } catch (e) {}
  }
  if (ROOTS.includes(route)) etat.racine = route;
  render();
  return true;
}
function retourPile() {
  if (etat.pile.length > 1) {
    const sortie = etat.pile.pop(), p = etat.pile[etat.pile.length - 1];
    if (router(p.route, p.params, { depuisPile: true }) === false) etat.pile.push(sortie);
    return true;
  }
  if (etat.route !== "flux" && etat.route !== "connexion" && etat.route !== "pin-verrou") { router("flux"); return true; }
  return false;
}

/* ---------- Code PIN (verrou local de l'appareil) ----------
   Le compte (nom + code) vit côté Supabase ; le code sert aussi de verrou local. Le code à 6 chiffres ouvre
   l'app sur CET appareil ; il est stocké haché (PBKDF2 + sel), jamais en clair.
   5 erreurs => déconnexion complète. */
const PIN = {
  dispo: !!(window.crypto && window.crypto.subtle),
  cle(id) { return "tobi_pin_" + id; },
  existe(id) { return !!chargerLocal(this.cle(id), null); },
  hex(octets) { return Array.from(octets).map(b => b.toString(16).padStart(2, "0")).join(""); },
  octets(h) { return new Uint8Array((h.match(/.{2}/g) || []).map(x => parseInt(x, 16))); },
  async empreinte(pin, sel) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: sel, iterations: 150000, hash: "SHA-256" }, base, 256);
    return this.hex(new Uint8Array(bits));
  },
  async definir(id, pin) {
    const sel = crypto.getRandomValues(new Uint8Array(16));
    sauverLocal(this.cle(id), { sel: this.hex(sel), h: await this.empreinte(pin, sel), essais: 0 });
  },
  async verifier(id, pin) {
    const d = chargerLocal(this.cle(id), null);
    if (!d) return { ok: false, restant: 0 };
    const h = await this.empreinte(pin, this.octets(d.sel));
    if (h === d.h) { d.essais = 0; sauverLocal(this.cle(id), d); return { ok: true }; }
    d.essais = (d.essais || 0) + 1; sauverLocal(this.cle(id), d);
    return { ok: false, restant: Math.max(0, 5 - d.essais) };
  },
  effacer(id) { try { localStorage.removeItem(this.cle(id)); } catch(e) {} }
};

function codeTropFacile(c) {
  return /^(\d)\1{5}$/.test(c) || ["123456", "654321", "012345", "123123", "112233"].includes(c);
}

function routeApresConnexion() {
  return PIN.dispo && !PIN.existe(etat.parentId) ? "pin-creation" : "flux";
}

async function deconnecter(message) {
  const id = etat.parentId;

  if (id) PIN.effacer(id);
  etat.parentId = null; etat.enfant = null;

}

function clavierPin(surComplet) {
  let saisie = "", occupe = false;
  const racine = document.createElement("div");
  function maj() {
    racine.innerHTML = `
      <div class="pin-points">${Array.from({ length: LONG_CODE }, (_, i) => i).map(i => `<span class="pin-point ${i < saisie.length ? "plein" : ""}"></span>`).join("")}</div>
      <div class="pin-clavier">${["1","2","3","4","5","6","7","8","9","","0","⌫"].map(t =>
        t === "" ? '<span class="pin-touche vide"></span>'
                 : `<button class="pin-touche" data-t="${t}" aria-label="${t === "⌫" ? "Effacer" : t}">${t}</button>`).join("")}</div>`;
    racine.querySelectorAll("[data-t]").forEach(b => b.onclick = async () => {
      if (occupe) return;
      const t = b.dataset.t;
      if (t === "⌫") { saisie = saisie.slice(0, -1); maj(); return; }
      if (saisie.length >= LONG_CODE) return;
      saisie += t; maj();
      if (saisie.length === LONG_CODE) {
        occupe = true;
        const pin = saisie;
        try { await surComplet(pin); } finally { occupe = false; }
      }
    });
  }
  racine.reinit = () => { saisie = ""; maj(); };
  maj();
  return racine;
}

  wrap.className = "ecran centre";

    haut.innerHTML = `${lumuSVG(96)}<h1>${titres[etape]}</h1>

      if (codeTropFacile(pin)) erreur = "Ce code est trop facile à deviner. Choisissez-en un autre.";
      else { premier = pin; etape = "confirmer"; }
    } else {
      if (pin === premier) {
        if (changer && etat.compteNom) {
          const { error } = await sb.auth.updateUser({ password: pin });
          if (error) { erreur = "Impossible de changer le code, réessayez."; etape = "nouveau"; premier = ""; entete(); pad.reinit(); return; }
        }
        await PIN.definir(etat.parentId, pin);
        router(changer ? (etat.params.retour || "profil") : "home");
        return;
      }
      erreur = "Les deux codes sont différents. Recommencez."; etape = "nouveau"; premier = "";

    entete(); pad.reinit();
  });

/* ---------- Écoute hors connexion : audios enregistrés + 20 dernières écoutes ---------- */
const HORS = {
  _db: null, ids: new Set(), MAX: 20, TAILLE_MAX: 120 * 1024 * 1024, enCours: new Set(), annul: new Set(),
  ouvrir() {
    if (this._db) return this._db;
    return (this._db = new Promise((ok, ko) => {
      try {
        const r = indexedDB.open("lumu-hors", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("audios", { keyPath: "id" });
        r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
      } catch (e) { ko(e); }
    }));
  },
  async op(mode, f) {
    const db = await this.ouvrir();
    return new Promise((ok, ko) => {
      const t = db.transaction("audios", mode), st = t.objectStore("audios"); let rq;
      try { rq = f(st); } catch (e) { ko(e); return; }
      t.oncomplete = () => ok(rq ? rq.result : undefined); t.onerror = t.onabort = () => ko(t.error);
    });
  },
  auto() { return chargerLocal("hors_auto", true) !== false; },
  regler(v) { sauverLocal("hors_auto", !!v); if (!v) return; },
  async lire(id) { try { return await this.op("readonly", st => st.get(id)); } catch (e) { return null; } },
  async tous() { try { return (await this.op("readonly", st => st.getAll())) || []; } catch (e) { return []; } },
  async init() {
    try { const r = await this.tous(); this.ids = new Set(r.filter(x => x.blob).map(x => x.id)); } catch (e) {}
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    this.bandeau();
    window.addEventListener("online", () => this.bandeau());
    window.addEventListener("offline", () => this.bandeau());
  },
  meta(c) {
    return { id: c.id, title: c.title, type: "audio", fichier_path: c.fichier_path, cover_path: c.cover_path || null, duration_seconds: c.duration_seconds || 0,
      auteur: c.auteur || null, channel_id: c.channel_id || null, status: "published", views_count: c.views_count || 0, yt_channels: c.yt_channels ? { name: c.yt_channels.name } : null };
  },
  /** Mémorise une écoute (20 dernières) */
  noter(c) {
    try {
      if (!c || c.type !== "audio" || c.embed_id || !c.fichier_path) return;
      let l = chargerLocal("recents_audio", []).filter(x => x.id !== c.id);
      l.unshift({ ...this.meta(c), ecoute: Date.now() });
      sauverLocal("recents_audio", l.slice(0, 40));
      this.purger();
    } catch (e) {}
  },
  /** Récents : 20 dernières écoutes ; manuels : conservés tant que non retirés */
  recents() { return chargerLocal("recents_audio", []).slice(0, this.MAX); },
  async purger() {
    try {
      const garde = new Set(this.recents().map(x => x.id));
      for (const r of await this.tous()) {
        if (!r.manuel && !garde.has(r.id)) { await this.op("readwrite", st => st.delete(r.id)); this.ids.delete(r.id); }
      }
    } catch (e) {}
  },

/* ---------- Mode Ramadan ---------- */
function infoRamadan() {
  const f = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { month: "numeric", day: "numeric" });
  const hij = d => { const o = {}; f.formatToParts(d).forEach(x => { if (x.type === "month" || x.type === "day") o[x.type] = +x.value; }); return o; };
  const auj = new Date(), h = hij(auj);
  if (h.month === 9) return { actif: true, jour: h.day };
  for (let i = 1; i <= 400; i++) { const d = new Date(auj.getTime() + i * 864e5), x = hij(d); if (x.month === 9 && x.day === 1) return { actif: false, avant: i }; }
  return { actif: false, avant: 999 };
}
function carteRamadan(zone, wrap) {
  let r; try { r = infoRamadan(); } catch (e) { return; }
  if (!r.actif && r.avant > 45) return;
  const pr = chargerLocal("priere_d", null);
  const aller = () => { const b = [...wrap.querySelectorAll("#lm-chips button, #lm-chips .chip")].find(x => /ramadan/i.test(x.textContent)); if (b) b.click(); };
  zone.innerHTML = `<button class="carte" style="width:100%;text-align:start;padding:14px;color:#fff;border:0;background:linear-gradient(135deg,#0f3d36,#1b6b5c 60%,#c9a227)"><b style="font-size:17px">🌙 ${r.actif ? "Ramadan Moubarak" : "Ramadan approche"}</b><br><span id="rm-t" style="font-size:14px;opacity:.95">${r.actif ? "Jour " + r.jour + " du mois béni" : "Dans " + r.avant + " jour" + (r.avant > 1 ? "s" : "")}</span><br><small style="opacity:.85">Voir les contenus de Ramadan ›</small></button>`;
  zone.firstChild.onclick = aller;
  if (r.actif && pr && pr.t && pr.tz) {
    const maj = () => {
      if (!zone.isConnected) return;
      let hm; try { hm = new Intl.DateTimeFormat("fr", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: pr.tz }).format(new Date()); } catch (e) { return; }
      const [hh, mm] = hm.replace(/\D/g, "").padStart(4, "0").match(/../g).map(Number), now = hh * 60 + mm;
      const mn = k => { const [a, b] = String(pr.t[k]).slice(0, 5).split(":").map(Number); return a * 60 + b; };
      const fmt = m => { m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0"); };
      const mag = mn("Maghrib"), faj = mn("Fajr");
      let txt;
      if (now < faj) txt = "Fin du repas (Fajr) dans " + fmt(faj - now);
      else if (now < mag) txt = "Rupture du jeûne (Maghrib) dans " + fmt(mag - now);
      else txt = "Bonne rupture du jeûne ! Fajr à " + String(pr.t.Fajr).slice(0, 5);
      const t = zone.querySelector("#rm-t"); if (t) t.textContent = "Jour " + r.jour + " · " + txt;
    };
    maj(); const iv = setInterval(() => { if (!zone.isConnected) clearInterval(iv); else maj(); }, 30000);
  } else if (r.actif) { const t = zone.querySelector("#rm-t"); if (t) t.textContent += " · ajoutez votre ville pour l'heure de la rupture"; }
}

  const auj = new Date().toISOString().slice(0, 10);
  let cache = chargerLocal("priere_d", null);

/* ---------- Lumu Radio ---------- */
const RADIO = {
  actif: false, pool: null, slot: 0, deja: new Set(), cur: null, fin: 0, tm: null, titre: "", genre: "", charge: false,
  SLOTS: [["Rappel", /rappel/i], ["Coran", /coran|quran|r[ée]citation/i], ["Invocation", /invocation|dou?a|dua|dhikr/i], ["Prêche", /pr[eê]che|conf[eé]rence|cours|khutba|[ée]ducation/i]],
  async charger() {
    if (this.pool) return;
    const r = await sb.from("yt_contenus").select("id,title,category,langue_contenu,fichier_path,cover_path,duration_seconds,channel_id,auteur,type,embed_id,yt_channels(name)").eq("status", "published").eq("type", "audio").order("published_at", { ascending: false }).limit(250);
    this.pool = ((r && r.data) || []).filter(c => c.fichier_path && !c.embed_id && langOk(c));
  },
  melanger(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  prochain() {
    const lg = (mesLangues() || [])[0] || "";
    for (let k = 0; k < this.SLOTS.length; k++) {
      const [nom, re] = this.SLOTS[(this.slot + k) % this.SLOTS.length];
      let l = this.pool.filter(c => re.test(c.category || "") && !this.deja.has(c.id));
      if (nom === "Prêche") { const f = l.filter(c => c.langue_contenu === "ff" || c.langue_contenu === lg); if (f.length) l = f; }
      if (l.length) { this.slot = (this.slot + k + 1) % this.SLOTS.length; this.genre = nom; return this.melanger(l)[0]; }
    }
    let l = this.pool.filter(c => !this.deja.has(c.id)); if (!l.length) { this.deja.clear(); l = this.pool; }
    this.genre = ""; return l.length ? this.melanger(l.slice())[0] : null;
  },
  async demarrer() {
    if (this.charge) return; this.charge = true; this.maj();
    try { await this.charger(); } catch (e) { this.pool = null; }
    this.charge = false;
    if (!this.pool || !this.pool.length) { this.msg = "Pas encore d'audio disponible."; this.maj(); return; }
    this.actif = true; this.msg = ""; this.suivant();
  },
  suivant() {
    if (!this.actif) return;
    const c = this.prochain(); if (!c) { this.actif = false; this.maj(); return; }
    this.deja.add(c.id); this.cur = c.id; this.titre = c.title; sauverLocal("pos_" + c.id, 0);
    AUD.jouer(c, () => this.suivant(), null); this.maj();
  },
  bascule() { if (!this.actif) return this.demarrer(); AUD.basculer(); },
  stop() { this.actif = false; this.cur = null; clearInterval(this.tm); this.fin = 0; this.maj(); },
  minuteur(min) {
    clearInterval(this.tm); this.fin = min ? Date.now() + min * 60000 : 0; this.maj();
    if (!min) return;
    this.tm = setInterval(() => {
      const reste = this.fin - Date.now();
      if (reste <= 0) { clearInterval(this.tm); this.fin = 0; this.actif = false; try { AUD.a.pause(); AUD.a.volume = 1; } catch (e) {} this.maj(); return; }
      if (reste < 8000) { try { AUD.a.volume = Math.max(0, reste / 8000); } catch (e) {} }
      this.maj();
    }, 1000);
  },
  maj() {
    const z = document.getElementById("radio-ui"); if (!z) return;
    const joue = this.actif && AUD.a && !AUD.a.paused && AUD.c && AUD.c.id === this.cur;
    z.classList.toggle("on", !!this.actif); z.classList.toggle("joue", !!joue);
    const bt = z.querySelector("#r-play"); bt.innerHTML = this.charge ? '<div class="spinner"></div>' : ico(joue ? "pause" : "play", 64, true);
    bt.setAttribute("aria-label", joue ? "Pause" : "Lecture");
    z.querySelector("#r-now").textContent = this.msg || (this.actif ? ((this.genre ? this.genre + " · " : "") + this.titre) : "👆 Écouter");
    z.querySelector("#r-skip").hidden = !this.actif;
    const rest = this.fin ? Math.max(0, Math.ceil((this.fin - Date.now()) / 60000)) : 0;
    z.querySelectorAll("[data-min]").forEach(b => { const m = +b.dataset.min; b.classList.toggle("on", m === 0 ? !this.fin : !!this.fin && Math.abs(rest - m) <= m && b.dataset.sel === "1"); });
    z.querySelector("#r-sleep").textContent = this.fin ? "😴 Arrêt dans " + rest + " min" : "";
  }
};

/* ---------- Ajouter un lien YouTube (contenu intégré, crédité) ---------- */
function analyserLienYoutube(texte) {
  const brut = (texte || "").trim();
  if (!brut) return null;
  try {
    const u = new URL(/^https?:\/\//i.test(brut) ? brut : "https://" + brut);
    const h = u.hostname.replace(/^(www|m|music)\./, "");
    const ok = id => /^[A-Za-z0-9_-]{6,64}$/.test(id || "");
    if (h === "youtu.be") { const id = u.pathname.slice(1).split("/")[0]; if (ok(id)) return { genre: "youtube", id }; }
    if (h === "youtube.com" || h === "youtube-nocookie.com") {
      const liste = u.searchParams.get("list"), v = u.searchParams.get("v");
      if (u.pathname === "/playlist" && ok(liste)) return { genre: "youtube-playlist", id: liste };
      if (ok(v)) return { genre: "youtube", id: v };
      const m = /^\/(shorts|embed|live|v)\/([A-Za-z0-9_-]{6,64})/.exec(u.pathname);
      if (m) return { genre: "youtube", id: m[2] };
      if (/^\/embed\/videoseries/.test(u.pathname) && ok(liste)) return { genre: "youtube-playlist", id: liste };
    }
  } catch (e) {}
  return null;
}

/* Glisser-déposer pour réordonner (souris et toucher) */
function glisserBloc(ev, bloc, zone, plId) {
  ev.preventDefault();
  const poignee = ev.currentTarget; try { poignee.setPointerCapture(ev.pointerId); } catch (e) {}
  bloc.classList.add("pl-glisse"); let bouge = false;
  const move = e => {
    bouge = true;
    const autres = [...zone.children].filter(x => x !== bloc);
    const apres = autres.find(x => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    if (apres) { if (bloc.nextSibling !== apres) zone.insertBefore(bloc, apres); } else if (zone.lastChild !== bloc) zone.appendChild(bloc);
    const h = window.innerHeight; if (e.clientY < 80) window.scrollBy(0, -12); else if (e.clientY > h - 80) window.scrollBy(0, 12);
  };
  const fin = async () => {
    poignee.removeEventListener("pointermove", move); poignee.removeEventListener("pointerup", fin); poignee.removeEventListener("pointercancel", fin);
    bloc.classList.remove("pl-glisse"); if (!bouge) return;
    const ordre = [...zone.children].map(x => x.dataset.cid);
    await Promise.all(ordre.map((cid, k) => sb.from("yt_playlist_items").update({ position: k }).eq("playlist_id", plId).eq("contenu_id", cid)));
    if (zone.isConnected) { const m = document.createElement("small"); m.textContent = "Ordre enregistré ✓"; m.style.color = "var(--vert)"; zone.parentNode.insertBefore(m, zone); setTimeout(() => m.remove(), 1800); }
  };
  poignee.addEventListener("pointermove", move); poignee.addEventListener("pointerup", fin); poignee.addEventListener("pointercancel", fin);
}

function barresSVG(valeurs, etiquettes, titre, surligner) {
  const W = 320, H = 110, n = Math.max(valeurs.length, 1), max = Math.max(...valeurs, 1), bw = W / n;
  const imax = surligner ? valeurs.indexOf(Math.max(...valeurs)) : -1;
  const barres = valeurs.map((v, i) => {
    const h = Math.round((v / max) * (H - 8));
    return `<rect x="${(i * bw + bw * 0.12).toFixed(1)}" y="${H - h}" width="${(bw * 0.76).toFixed(1)}" height="${Math.max(h, v > 0 ? 2 : 0)}" rx="2" fill="${i === imax && v > 0 ? "var(--jaune)" : "var(--lien)"}"><title>${esc(etiquettes[i])} : ${v}</title></rect>`;
  }).join("");
  const court = x => String(x).replace(/^\d{4}-/, "");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(titre)}" preserveAspectRatio="none" style="display:block;max-height:130px"><line x1="0" x2="${W}" y1="${H - 0.5}" y2="${H - 0.5}" stroke="var(--bordure)" stroke-width="1"/>${barres}</svg><div style="display:flex;justify-content:space-between;color:var(--texte-doux);font-size:11px"><span>${esc(court(etiquettes[0] || ""))}</span><span>max ${max}</span><span>${esc(court(etiquettes[etiquettes.length - 1] || ""))}</span></div>`;
}

/* ---------- Palette de commandes (Cmd/Ctrl + K) ---------- */
const PAL = { ouvert: false };
function ouvrirPalette() {
  if (PAL.ouvert || (typeof PE !== "undefined" && PE.ouvert)) return;
  PAL.ouvert = true;
  const fond = document.createElement("div"); fond.className = "pal-fond";
  fond.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="Recherche rapide"><input id="pq" type="search" dir="auto" placeholder="Rechercher une vidéo, un savant, une page…" autocomplete="off" aria-label="Rechercher"><div class="pal-l" id="pl" role="listbox"></div><div class="pal-pied"><span>↑↓ naviguer</span><span>↵ ouvrir</span><span>esc fermer</span></div></div>`;
  document.body.appendChild(fond);
  const champ = fond.querySelector("#pq"), liste = fond.querySelector("#pl");
  let items = [], sel = 0, seq = 0, minut = null;
  const fermer = () => { PAL.ouvert = false; fond.remove(); document.removeEventListener("keydown", clav, true); };
  const actions = [
    ["🏠", "Flux", () => router("flux")], ["🧭", "Découvrir", () => router("home")], ["🎞️", "Reels", () => router("reels")],
    ["🔔", "Abonnements", () => router("abos")], ["⭐", "Favoris", () => router("favoris")], ["🕘", "Historique", () => router("historique")],
    ["🔎", "Recherche avancée", () => router("recherche")], ["💎", "Tarifs", () => router("tarifs")], ["✨", "Présentation de Lumu", () => router("presentation")],
    ["👤", "Mon profil", () => router("profil")],
    ["🌓", "Changer de thème", () => { ACCES.suivant(); }],
    ["🔠", "Grand texte", () => { ACCES.regler(!ACCES.grand()); }]
  ];
  function dessiner(groupes) {
    liste.innerHTML = ""; items = [];
    groupes.forEach(([titre, lignes]) => {
      if (!lignes.length) return;
      const g = document.createElement("div"); g.className = "pal-g"; g.textContent = titre; liste.appendChild(g);
      lignes.forEach(l => {
        const e = document.createElement("div"); e.className = "pal-i"; e.setAttribute("role", "option");
        e.innerHTML = `<span>${l.ic}</span><span class="t" dir="auto">${esc(l.t)}</span>${l.d ? `<small>${esc(l.d)}</small>` : ""}`;
        e.onclick = () => { fermer(); l.fn(); };
        e.onmousemove = () => { sel = items.indexOf(e); marquer(); };
        e._fn = l.fn; liste.appendChild(e); items.push(e);
      });
    });
    sel = 0; marquer();
    if (!items.length) liste.innerHTML = `<p style="padding:16px;color:var(--texte-doux)">Aucun résultat.</p>`;
  }
  function marquer() { items.forEach((e, i) => { e.classList.toggle("sel", i === sel); if (i === sel) e.scrollIntoView({ block: "nearest" }); }); }
  const norm = x => (x || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  async function chercher() {
    const q = champ.value.trim(), mon = ++seq;
    const acts = actions.filter(a => !q || norm(a[1]).includes(norm(q))).map(a => ({ ic: a[0], t: a[1], fn: a[2] }));
    if (q.length < 2) { dessiner([["Aller à", acts]]); return; }
    dessiner([["Aller à", acts.slice(0, 3)]]);
    try {
      const mot = q.replace(/[%,()*\\]/g, " ").trim();
      const [lot, ch] = await Promise.all([
        chargerContenus({ type: "", categorie: "", q, depuis: 0, nb: 6 }).catch(() => []),
        sb.from("yt_channels").select("id,name").ilike("name", `%${mot}%`).limit(3).then(r => r.data || [], () => [])
      ]);
      if (mon !== seq || !fond.isConnected) return;
      dessiner([
        ["Contenus", lot.map(c => ({ ic: (TYPES[c.type] || TYPES.video).ic, t: c.title, d: (c.yt_channels && c.yt_channels.name) || "", fn: () => router("contenu", { id: c.id, c }) }))],
        ["Chaînes", ch.map(x => ({ ic: "📺", t: x.name, fn: () => router("chaine", { id: x.id }) }))],
        ["Aller à", acts]
      ]);
    } catch (e) {}
  }
  function clav(ev) {
    if (ev.key === "Escape") { ev.preventDefault(); fermer(); }
    else if (ev.key === "ArrowDown") { ev.preventDefault(); sel = Math.min(items.length - 1, sel + 1); marquer(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); sel = Math.max(0, sel - 1); marquer(); }
    else if (ev.key === "Enter") { ev.preventDefault(); const e = items[sel]; if (e) { fermer(); e._fn(); } }
  }
  document.addEventListener("keydown", clav, true);
  fond.onclick = ev => { if (ev.target === fond) fermer(); };
  champ.oninput = () => { clearTimeout(minut); minut = setTimeout(chercher, 180); };
  chercher(); setTimeout(() => champ.focus(), 20);
}
document.addEventListener("keydown", ev => {
  const cible = ev.target, saisie = cible && (cible.tagName === "INPUT" || cible.tagName === "TEXTAREA" || cible.isContentEditable);
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); ouvrirPalette(); }
  else if (ev.key === "/" && !saisie && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); ouvrirPalette(); }
});

/* ---------- Notifications quotidiennes (Web Push) ---------- */
const PUSH = (() => {
  const CLE = "BBTk3ckpTtOF3zvR8gUoB1yq-jhExwFwr_pBnKj-ORRH6MLfxnoTVAWsdEFOfhSpNhxzE8ASh6DcxbTKOzRHesk";
  const dispo = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const b64 = v => { const p = "=".repeat((4 - v.length % 4) % 4), r = atob((v + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
  const ab = x => btoa(String.fromCharCode(...new Uint8Array(x))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const lire = k => { try { return localStorage.getItem(k) !== "0"; } catch (e) { return true; } };
  const permOk = () => { try { return Notification.permission === "granted" && localStorage.getItem("lumu_push") === "1"; } catch (e) { return false; } };
  const pref = k => permOk() && lire("lumu_push_" + k);
  const actif = () => pref("jour") || pref("nouveau");
  async function sync() {
    try {
      const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (!sub) return false;
      const j = sub.toJSON();
      await sb.rpc("push_enregistrer", { p_endpoint: sub.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_langue: (typeof mesLangues === "function" ? (mesLangues() || [])[0] : null) || null, p_jour: lire("lumu_push_jour"), p_nouveau: lire("lumu_push_nouveau") });
      return true;
    } catch (e) { return false; }
  }
  async function activer() {
    if (!dispo()) return false;
    try {
      const perm = await Notification.requestPermission(); if (perm !== "granted") return false;
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(CLE) });
      localStorage.setItem("lumu_push", "1");
      if (!lire("lumu_push_jour") && !lire("lumu_push_nouveau")) { localStorage.setItem("lumu_push_jour", "1"); localStorage.setItem("lumu_push_nouveau", "1"); }
      return await sync();
    } catch (e) { return false; }
  }
  async function couper() {
    try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) { await sb.rpc("push_supprimer", { p_endpoint: sub.endpoint }); await sub.unsubscribe(); } } catch (e) {}
    try { localStorage.setItem("lumu_push", "0"); } catch (e) {}
  }
  /* k = "jour" | "nouveau" ; v = true/false ; renvoie false si refus */
  async function regler(k, v) {
    try { localStorage.setItem("lumu_push_" + k, v ? "1" : "0"); } catch (e) {}
    if (v && !permOk()) { const ok = await activer(); if (!ok) { try { localStorage.setItem("lumu_push_" + k, "0"); } catch (e) {} return false; } return true; }
    if (!lire("lumu_push_jour") && !lire("lumu_push_nouveau")) { await couper(); return true; }
    await sync(); return true;
  }
  function inviter() {
    try {
      if (!dispo() || Notification.permission !== "default" || localStorage.getItem("lumu_push_vu")) return;
      const n = +(localStorage.getItem("lumu_visites") || 0) + 1; localStorage.setItem("lumu_visites", n); if (n < 2) return;
      setTimeout(() => {
        if (document.getElementById("push-inv")) return;
        const d = document.createElement("div"); d.id = "push-inv"; d.setAttribute("role", "dialog");
        d.style.cssText = "position:fixed;left:12px;right:12px;bottom:88px;z-index:9999;background:#fff;color:#1b1b1b;border-radius:24px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.28);text-align:center;font:600 18px system-ui,sans-serif";
        d.innerHTML = '<div style="font-size:64px;line-height:1">🔔</div><div style="margin:8px 0 14px;font-size:20px">Une lumière chaque matin ?</div><div style="display:flex;gap:12px"><button id="pi-o" style="flex:1;min-height:72px;border:0;border-radius:36px;background:#0F8A5F;color:#fff;font:800 26px system-ui">👍 OUI</button><button id="pi-n" style="flex:1;min-height:72px;border:0;border-radius:36px;background:#e8ebe9;color:#333;font:800 26px system-ui">✋ NON</button></div>';
        document.body.appendChild(d);
        d.querySelector("#pi-o").onclick = async () => { localStorage.setItem("lumu_push_vu", "1"); d.remove(); await activer(); };
        d.querySelector("#pi-n").onclick = () => { localStorage.setItem("lumu_push_vu", "1"); d.remove(); };
      }, 6000);
    } catch (e) {}
  }
  return { dispo, actif, pref, activer, couper, regler, inviter };
})();

function nomTelechargement(c) {
  const ext = ((c.fichier_path || "").split(".").pop() || "").toLowerCase();
  const base = String(c.title || "fichier").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 100) || "fichier";
  return ext && !base.toLowerCase().endsWith("." + ext) ? base + "." + ext : base;
}
/* ---------- Envoyer / enregistrer l'audio, tout télécharger, minuterie ---------- */
function nomFichierAudio(c) { const ext = ((c.fichier_path || "").split("?")[0].split(".").pop() || "mp3").toLowerCase().slice(0, 4); return (c.title || "audio").replace(/[\\/:*?"<>|]/g, " ").trim().slice(0, 60) + "." + ext; }
function mimeAudio(c) { if (c.mime) return c.mime; const e = (c.fichier_path || "").split(".").pop().toLowerCase(); return e === "m4a" ? "audio/mp4" : e === "ogg" ? "audio/ogg" : e === "wav" ? "audio/wav" : "audio/mpeg"; }
async function envoyerAudio(c, btn) {
  const url = urlMedia(c.fichier_path), nom = nomFichierAudio(c), mime = mimeAudio(c);
  if (window.LumuNative && LumuNative.partagerFichier) { LumuNative.partagerFichier(url, nom, mime, c.title || "Lumu"); return; }
  const txt = btn ? btn.textContent : ""; if (btn) { btn.disabled = true; btn.textContent = "…"; }
  try {
    let blob = null;
    try { blob = await HORS.lireBlob?.(c.id); } catch (e) {}
    if (!blob) { const r = await fetch(url); if (!r.ok) throw 0; blob = await r.blob(); }
    const f = new File([blob], nom, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: c.title || "Lumu" }); }
    else { await partagerContenu(c, null); }
  } catch (e) { if (!(e && e.name === "AbortError")) { try { await partagerContenu(c, null); } catch (x) {} } }
  if (btn) { btn.disabled = false; btn.textContent = txt; }

function typeAuto(f) {
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  let m = (f.type || "").toLowerCase();
  if (!m || m === "application/octet-stream") m = MIME_EXT[ext] || "";
  m = MIME_SYN[m] || m;
  if (m.startsWith("video/")) return "video";
  if (m.startsWith("audio/")) return "audio";
  if (IMG_OK.includes(m)) return "image";
  if (!EXT_DE_MIME[m]) return "fichier";
  if (m === "application/pdf") return "pdf";
  if (m === "application/epub+zip") return "livre";
  return "fichier";
}
async function importerUn(it, commun, maj) {
  const f = it.f, type = it.type, ext = (f.name.split(".").pop() || "").toLowerCase();
  if (type === "fichier" && EXT_BLOQUEES.includes(ext)) throw new Error("Type de fichier non autorisé (sécurité).");
  const mime = mimeDe(f, type);
  if (!mimeCoherent(mime, type)) throw new Error("Format non accepté.");
  if (f.size > TAILLE_MAX[type]) throw new Error(`Trop gros (maximum ${fmtTaille(TAILLE_MAX[type])}).`);
  maj("Lecture…");
  let meta;
  try { meta = await lireMeta(f, type); } catch (e) { if (type === "video" || type === "audio") meta = { duree: null, vignette: null }; else throw e; }
  if (meta.duree && meta.duree > DUREE_MAX) throw new Error("Dure plus de 2 h.");
  const uid = etat.parentId, idc = uuid();
  const extNom = ((ext).match(/^[a-z0-9]{1,8}$/) || [""])[0];
  const chemin = `${uid}/${idc}.${extFichier(mime, extNom)}`;
  const cheminCover = `${uid}/${idc}-cover.jpg`;
  const envoi = envoyerFichier(f, chemin, mime, (a, b) => maj(`${b ? Math.min(100, Math.floor(a * 100 / b)) : 0} %`));
  it.envoi = envoi;
  await envoi.promesse;
  let coverOk = false;
  if (meta.vignette) { const r = await sb.storage.from("yt-media").upload(cheminCover, meta.vignette, { contentType: "image/jpeg", upsert: false }); coverOk = !r.error; }
  const titre = f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim().slice(0, 150) || "Sans titre";
  const { data, error } = await sb.from("yt_contenus").insert({
    channel_id: etat.chaine.id, title: titre, category: commun.cat || "Autre", type, fichier_path: chemin, cover_path: coverOk ? cheminCover : null,
    duration_seconds: meta.duree ? Math.round(meta.duree) : null, taille_octets: f.size, mime, status: "published", published_at: new Date().toISOString()
  }).select("id").single();
  if (error) { await sb.storage.from("yt-media").remove([chemin, ...(coverOk ? [cheminCover] : [])]).catch(() => {}); throw error; }
  if (commun.groupe) { try { await sb.from("yt_groupe_posts").insert({ groupe_id: commun.groupe, contenu_id: data.id }); } catch (e) {} }
}

        const m = o.norm(r), j = CHAT.jour(m.created_at);
        if (j !== jourAff) { jourAff = j; const s = document.createElement("div"); s.className = "cv-jour"; s.innerHTML = `<span>${esc(j)}</span>`; fil.appendChild(s); }
        const el = CHAT.bulle(m, o.groupe);
        if (o.peutSuppr(r)) {
          const d = document.createElement("button"); d.className = "cv-del"; d.textContent = "🗑"; d.setAttribute("aria-label", "Supprimer");
          d.onclick = async () => {
            if (!confirm("Supprimer ce message ?")) return;
            const x = await o.supprimer(r);
            if (x && x.error) return alert(txtErr(x.error));
            el.remove();
          };
          el.querySelector(".cv-h").prepend(d);
        }
        fil.appendChild(el);
        if (!dernier || m.created_at > dernier) dernier = m.created_at;
      });
      if (collerBas) fil.scrollTop = fil.scrollHeight;
    }
    async function rafraichir() {
      if (ferme) return;
      if (!fil.isConnected) return stop();
      try {
        const rows = await o.lire(dernier);
        if (rows && rows.length) { ajouter(rows); if (o.onRecu) o.onRecu(rows); }
      } catch (e) {}
    }
    function stop() {
      ferme = true; clearInterval(iv); document.removeEventListener("visibilitychange", vis);
      if (canal) { try { sb.removeChannel(canal); } catch (e) {} canal = null; }
    }
    const vis = () => { if (!document.hidden) rafraichir(); };
    document.addEventListener("visibilitychange", vis);
    iv = setInterval(() => { if (!document.hidden) rafraichir(); }, 7000);
    try {
      const cfg = { event: "INSERT", schema: "public", table: o.table }; if (o.filtre) cfg.filter = o.filtre;
      canal = sb.channel(o.canal).on("postgres_changes", cfg, () => rafraichir()).subscribe();
    } catch (e) {}
    return {
      ajouter, stop,
      async demarrer() {
        try { const rows = await o.lire(null); fil.innerHTML = ""; ajouter(rows); if (!rows.length) fil.innerHTML = `<p class="cv-vide">Aucun message pour l'instant. Écrivez le premier !</p>`; if (o.onRecu) o.onRecu(rows); }
        catch (e) { fil.innerHTML = `<p class="cv-vide erreur">${esc(txtErr(e, "Chargement impossible."))}</p>`; }
      }
    };
  },
  compositeur(pied, o) {
    let rec = null, flux = null, morceaux = [], t0 = 0, tim = null, envoi = false, annule = false;
    function normal() {
      pied.innerHTML = `<div class="cv-comp">${o.extra ? `<button class="cv-att" id="cv-att" aria-label="Joindre une publication">📎</button>` : ""}
        <textarea id="cv-t" rows="1" maxlength="2000" placeholder="Message" dir="auto" aria-label="Message"></textarea>
        <button class="cv-btn" id="cv-go" aria-label="Enregistrer un message vocal">🎤</button></div><p class="erreur" id="cv-err" hidden></p>`;
      const t = pied.querySelector("#cv-t"), go = pied.querySelector("#cv-go"), err = pied.querySelector("#cv-err");
      const montrer = m => { err.textContent = m || ""; err.hidden = !m; };
      const maj = () => { const v = t.value.trim(); go.textContent = v ? "➤" : "🎤"; go.setAttribute("aria-label", v ? "Envoyer" : "Enregistrer un message vocal"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 110) + "px"; };
      t.oninput = maj;
      go.onclick = async () => {
        const v = t.value.trim();
        if (!v) return demarrer(montrer);
        if (envoi) return;
        envoi = true; go.disabled = true; montrer("");
        try { await o.texte(v); t.value = ""; maj(); } catch (e) { montrer(txtErr(e, "Message non envoyé.")); }
        envoi = false; go.disabled = false;
      };
      if (o.extra) pied.querySelector("#cv-att").onclick = o.extra;
    }
    async function demarrer(montrer) {
      if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return montrer("Enregistrement non disponible sur cet appareil.");
      try { flux = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return montrer("Autorisez le micro pour envoyer un vocal."); }
      const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || "";
      morceaux = []; annule = false;
      try { rec = new MediaRecorder(flux, mime ? { mimeType: mime } : undefined); }
      catch (e) { flux.getTracks().forEach(x => x.stop()); return montrer("Enregistrement non disponible sur cet appareil."); }
      rec.ondataavailable = e => { if (e.data && e.data.size) morceaux.push(e.data); };
      rec.onstop = async () => {
        flux.getTracks().forEach(x => x.stop()); clearInterval(tim);
        const duree = Math.round((Date.now() - t0) / 1000);
        if (!pied.isConnected) return;
        if (annule || duree < 1 || !morceaux.length) return normal();
        const blob = new Blob(morceaux, { type: rec.mimeType || mime || "audio/webm" });
        pied.innerHTML = `<div class="cv-rec"><div class="spinner" style="width:22px;height:22px"></div><b>Envoi du vocal…</b></div>`;
        try { await o.vocal(blob, duree); normal(); }
        catch (e) { normal(); const er = pied.querySelector("#cv-err"); if (er) { er.textContent = txtErr(e, "Vocal non envoyé."); er.hidden = false; } }
      };
      rec.start(); t0 = Date.now();
      pied.innerHTML = `<div class="cv-rec"><button class="cv-btn cv-x" id="cv-ann" aria-label="Annuler">🗑</button><b><span class="cv-point">●</span> <span id="cv-tps">0:00</span></b><button class="cv-btn" id="cv-ok" aria-label="Envoyer le vocal">➤</button></div>`;
      const fin = () => { if (rec && rec.state === "recording") rec.stop(); };
      pied.querySelector("#cv-ann").onclick = () => { annule = true; fin(); };
      pied.querySelector("#cv-ok").onclick = fin;
      tim = setInterval(() => {
        if (!pied.isConnected) { annule = true; return fin(); }
        const s = Math.round((Date.now() - t0) / 1000), el = pied.querySelector("#cv-tps");
        if (el) el.textContent = CHAT.mm(s);
        if (s >= 180) fin();
      }, 400);
    }
    normal();
  },
  ligne(p, sous, quand, nb, clic) {
    const c = document.createElement("div");
    c.className = "carte cv-ligne"; c.tabIndex = 0; c.setAttribute("role", "button");
    c.innerHTML = `${CHAT.av(p)}<div class="cv-lt"><b dir="auto" data-notrad>${esc(p)}</b><small dir="auto">${esc(sous || "")}</small></div><div class="cv-lq">${quand ? `<small>${esc(quand)}</small>` : ""}${nb > 0 ? `<span class="cv-nb">${nb}</span>` : ""}</div>`;
    c.onclick = clic; c.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); clic(); } };
    return c;
  }
};

async function vueDiscussions() {
  if (!etat.parentId) return exigerConnexion();
  let onglet = (etat.params && etat.params.onglet) || "p";
  const w = ecran("Discussions", ["flux"], `<input class="champ" id="q" type="search" placeholder="Chercher une personne par son nom" style="margin:0" aria-label="Chercher une personne par son nom">

  const liste = w.querySelector("#liste"), res = w.querySelector("#res"), q = w.querySelector("#q");
  let seq = 0, minuteur = null;
  const vide = t => `<p class="cv-vide">${esc(t)}</p>`;
  async function privees() {
    const mon = ++seq;
    try {
      const r = await sb.rpc("yt_mes_conversations");

      (r.data || []).forEach(c => {
        const auj = new Date(c.dernier_le).toDateString() === new Date().toDateString();
        liste.appendChild(CHAT.ligne(c.nom, c.a_audio && !c.dernier ? "🎤 Message vocal" : (c.dernier || "🎤"), auj ? CHAT.heure(c.dernier_le) : CHAT.jour(c.dernier_le), Number(c.non_lus) || 0, () => router("conv", { id: c.pair, nom: c.nom })));
      });
    } catch (e) { if (mon === seq && w.isConnected) liste.innerHTML = `<p class="erreur">${esc(txtErr(e, "Chargement impossible."))}</p>`; }
  }
  async function groupes() {
    const mon = ++seq;
    liste.innerHTML = `<button class="btn" id="ng">＋ Nouveau groupe</button><button class="btn-outline" id="tg">🔎 Trouver un groupe</button><div id="mg"></div>`;
    liste.querySelector("#ng").onclick = () => router("groupe-nouveau");
    liste.querySelector("#tg").onclick = () => router("groupes");
    try {
      const r = await sb.from("yt_groupe_membres").select("groupe_id,yt_groupes(id,nom)").eq("user_id", etat.parentId);
      if (r.error) throw r.error;
      if (mon !== seq || !w.isConnected) return;
      const mg = liste.querySelector("#mg"), l = (r.data || []).filter(x => x.yt_groupes);
      mg.innerHTML = l.length ? "" : vide("Vous n'êtes dans aucun groupe.");
      l.forEach(x => mg.appendChild(CHAT.ligne(x.yt_groupes.nom, "", "", 0, () => router("groupe", { id: x.yt_groupes.id }))));
    } catch (e) { if (mon === seq && w.isConnected) liste.querySelector("#mg").innerHTML = `<p class="erreur">${esc(txtErr(e, "Chargement impossible."))}</p>`; }
  }
  function afficher() {
    w.querySelectorAll("#ong button").forEach(b => b.classList.toggle("actif", b.dataset.t === onglet));
    onglet === "g" ? groupes() : privees();
  }
  w.querySelectorAll("#ong button").forEach(b => b.onclick = () => { onglet = b.dataset.t; afficher(); });
  async function chercher() {
    const mot = q.value.trim();
    if (mot.length < 2) { res.innerHTML = ""; w.querySelector("#ong").hidden = false; liste.hidden = false; return; }
    w.querySelector("#ong").hidden = true; liste.hidden = true;
    const mon = ++seq;
    try {
      const r = await sb.rpc("yt_chercher_personnes", { q: mot });
      if (r.error) throw r.error;
      if (mon !== seq || !w.isConnected) return;
      res.innerHTML = (r.data || []).length ? "" : vide("Personne introuvable.");
      (r.data || []).forEach(p => res.appendChild(CHAT.ligne(p.nom, "", "", 0, () => router("conv", { id: p.id, nom: p.nom }))));
    } catch (e) { if (mon === seq && w.isConnected) res.innerHTML = `<p class="erreur">${esc(txtErr(e, "Chargement impossible."))}</p>`; }
  }
  q.oninput = () => { clearTimeout(minuteur); minuteur = setTimeout(chercher, 350); };
  afficher();
}

async function vueConv() {
  if (!etat.parentId) return exigerConnexion();
  const pair = etat.params.id, me = etat.parentId;
  const w = CHAT.ecran(["discussions"]);
  const fil = w.querySelector(".cv-fil"), pied = w.querySelector(".cv-pied");
  fil.innerHTML = `<div class="centre"><div class="spinner"></div></div>`;
  let nom = (etat.params && etat.params.nom) || "…", bloque = false, ses = null;
  const entete = () => { w.querySelector("#cv-id").innerHTML = `${CHAT.av(nom)}<div><b dir="auto" data-notrad>${esc(nom)}</b></div>`; };
  entete();
  try {
    const [p, b] = await Promise.all([sb.rpc("yt_personne", { p: pair }), sb.from("yt_blocages").select("bloque").eq("bloque", pair).maybeSingle()]);
    if (p.error) throw p.error;
    const x = (p.data || [])[0];

  function bas() {
    if (bloque) {
      pied.innerHTML = `<p style="text-align:center;margin:6px">Vous avez bloqué cette personne.</p><button class="btn-outline" id="deb">Débloquer</button>`;

      return;
    }
    CHAT.compositeur(pied, {
      texte: async v => { const r = await sb.from("yt_dm").insert({ vers: pair, body: v }).select().single(); if (r.error) throw r.error; ses.ajouter([r.data]); },
      vocal: async (blob, duree) => { const chemin = await CHAT.televerser(blob); const r = await sb.from("yt_dm").insert({ vers: pair, audio_path: chemin, audio_duree: duree }).select().single(); if (r.error) throw r.error; ses.ajouter([r.data]); }
    });
  }
  bas();
  w.querySelector("#cv-men").onclick = () => CHAT.panneau(w, "menu", `<button class="btn-text" id="blq" style="color:var(--rouge)">${bloque ? "Débloquer" : "Bloquer cette personne"}</button>`, p => {
    p.querySelector("#blq").onclick = async () => {
      if (!bloque && !confirm("Bloquer cette personne ?")) return;

      if (r.error) return alert(txtErr(r.error));
      bloque = !bloque; p.hidden = true; bas();
    };
  });
  const filtre = `de=eq.${me},vers=eq.${pair}`;
  const reqBase = () => sb.from("yt_dm").select("*").or(`and(de.eq.${me},vers.eq.${pair}),and(de.eq.${pair},vers.eq.${me})`);
  ses = CHAT.session({
    fil, groupe: false, table: "yt_dm", filtre: `vers=eq.${me}`, canal: "dm-" + pair + "-" + Date.now(),
    lire: async depuis => {
      if (depuis) { const r = await reqBase().gte("created_at", depuis).order("created_at", { ascending: true }).limit(100); if (r.error) throw r.error; return r.data || []; }
      const r = await reqBase().order("created_at", { ascending: false }).limit(100); if (r.error) throw r.error; return (r.data || []).reverse();
    },
    norm: r => ({ id: r.id, mine: r.de === me, nom, body: r.body, audio_path: r.audio_path, audio_duree: r.audio_duree, created_at: r.created_at }),
    peutSuppr: r => r.de === me,
    supprimer: r => sb.from("yt_dm").delete().eq("id", r.id),
    onRecu: rows => { if (rows.some(r => r.vers === me && !r.lu)) sb.rpc("yt_dm_marquer_lu", { p: pair }).then(() => {}, () => {}); }
  });
  ses.demarrer();
}

function idYoutube(url) {
  try {
    const u = new URL(url), h = u.hostname.replace(/^www\.|^m\./, "");
    let id = "";
    if (h === "youtu.be") id = u.pathname.slice(1);
    else if (h === "youtube.com" || h === "youtube-nocookie.com") id = u.searchParams.get("v") || (/^\/(live|embed|shorts)\/([\w-]{6,})/.exec(u.pathname) || [])[2] || "";
    return /^[\w-]{6,20}$/.test(id) ? id : "";
  } catch (e) { return ""; }
}
function etiquetteLive(l) {
  if (l.statut === "en_cours") return ["🔴 En direct", "rouge"];
  if (l.statut === "termine") return ["Terminé", ""];
  return [new Date(l.starts_at) < new Date() ? "Prévu" : "À venir", ""];
}

pted.", "تنسيق الملف غير مقبول.", "Ko'e fayil jaɓaaka.", "Ba a karɓi tsarin fayil ɗin ba."], "Ce format (AMR, enregistreur vocal) ne peut pas être lu dans Lumu. Utilisez le bouton « Enregistrer » de Lumu, ou un fichier MP3 / M4A.": ["This format (AMR, voice recorder) cannot be played in Lumu. Use Lumu's “Record” button, or an MP3 / M4A file.", "لا يمكن تشغيل هذا التنسيق (AMR، مسجل الصوت) في لومو. استخدم زر «تسجيل» في لومو أو ملف MP3 / M4A.", "Ko'e (AMR, mooftirde daande) waawaa jannde e Lumu. Huutin buttu « Hisnu daande » Lumu walla fayil MP3 / M4A.", "Ba za a iya kunna wannan tsari (AMR, na'urar rikodin murya) a Lumu ba. Yi amfani da maɓallin “Rikodi” na Lumu, ko fayil MP3 / M4A."], "Le fichier est vide ou incomplet. S'il vient de Google Photos, téléchargez-le d'abord sur le téléphone.": ["The file is empty or incomplete. If it comes from Google Photos, download it to the phone first.", "الملف فارغ أو غير مكتمل. إن كان من صور Google فنزّله أولًا على الهاتف.", "Fayil ɗu ɗon yoori walla timmaaki. To ɗum Google Photos, ronndu ɗum fuɗɗoode e telefoon.", "Fayil ɗin babu komai ko bai cika ba. Idan daga Google Photos ne, zazzage shi zuwa waya tukuna."], "Audio non lisible par le navigateur. Utilisez un fichier MP3 ou M4A complet.": ["Audio can't be played by the browser. Use a complete MP3 or M4A file.", "الصوت غير قابل للتشغيل في المتصفح. استخدم ملف MP3 أو M4A كاملًا.", "Sawtu ndu browser waawaa jannde. Huutin fayil MP3 walla M4A timmuɗum.", "Browser ba ya iya kunna sautin. Yi amfani da cikakken fayil MP3 ko M4A."], "Durée illisible : réenregistrez le fichier en MP4 ou MP3.": ["Unreadable duration: re-save the file as MP4 or MP3.", "مدة غير مقروءة: أعد حفظ الملف بصيغة MP4 أو MP3.", "Duuɓi ɓaawaaki: hisnu fayil ɗu e MP4 walla MP3.", "Tsawon lokaci ba a iya karantawa ba: sake adana fayil ɗin da MP4 ko MP3."], "Fichier trop gros pour l'espace de stockage actuel.": ["File too large for current storage.", "الملف كبير جدًا بالنسبة لمساحة التخزين الحالية.", "Fayil ɗu mawni no feewi.", "Fayil ya yi girma da ajiyar da ake da ita."], "Gardez cet écran ouvert. Si le réseau coupe, l'envoi reprend tout seul.": ["Keep this screen open. If the network drops, the upload resumes by itself.", "أبقِ هذه الشاشة مفتوحة. إذا انقطعت الشبكة يستأنف الإرسال تلقائيًا.", "Reen kuuɓal ɗu uddaaɗum. To nder resoo ɗon ɗon, neldal jokkoto no hoolaa.", "Ka bar wannan allon a buɗe. Idan hanyar sadarwa ta ɓace, aikawa za ta ci gaba da kanta."], "Gardez cet écran ouvert et allumé. Si le réseau coupe, l'envoi reprend tout seul.": ["Keep this screen open and on. If the network drops, the upload resumes by itself.", "أبقِ هذه الشاشة مفتوحة ومضاءة. إذا انقطعت الشبكة يستأنف الإرسال تلقائيًا.", "Reen kuuɓal ɗu uddaaɗum e wurtiiɗum. To resoo ɗon ɗon, neldal jokkoto no hoolaa.", "Ka bar wannan allon a buɗe kuma a kunne. Idan hanyar sadarwa ta ɓace, aikawa za ta ci gaba da kanta."], "Gardez l'écran allumé pendant l'envoi. Si le réseau coupe, l'envoi reprend tout seul.": ["Keep the screen on during upload. If the network drops, the upload resumes by itself.", "أبقِ الشاشة مضاءة أثناء الإرسال. إذا انقطعت الشبكة يستأنف الإرسال تلقائيًا.", "Reen kuuɓal wurtiiɗum nde nelda. To resoo ɗon ɗon, neldal jokkoto no hoolaa.", "Ka bar allon a kunne yayin aikawa. Idan hanyar sadarwa ta ɓace, aikawa za ta ci gaba da kanta."], "Restez sur cet écran pendant la création.": ["Stay on this screen during creation.", "ابقَ على هذه الشاشة أثناء الإنشاء.", "Reen e kuuɓal ɗu nde waɗata.", "Ka tsaya a wannan allon yayin ƙirƙira."], "Durée maximale : 2 h pour une vidéo ou un audio. Gardez l'écran allumé pendant l'envoi.": ["Maximum duration: 2 h for a video or audio. Keep the screen on during upload.", "المدة القصوى: ساعتان لفيديو أو صوت. أبقِ الشاشة مضاءة أثناء الإرسال.", "Ɓuri duuɓal: 2 h ngam wideyo walla sawtu. Reen kuuɓal wurtiiɗum.", "Matsakaicin tsawo: awa 2 don bidiyo ko sauti. Ka bar allon a kunne yayin aikawa."], "Un envoi est en cours. Quitter l'annulera. Continuer ?": ["An upload is in progress. Leaving will cancel it. Continue?", "هناك إرسال جارٍ. المغادرة ستلغيه. المتابعة؟", "Neldal ɗon yahda. Yaadugo ɗum haaɗan. Jokku?", "Ana aikawa. Fita zai soke ta. Ci gaba?"], "Donnez un titre à votre publication.": ["Give your post a title.", "أعطِ منشورك عنوانًا.", "Hokku wurtinol maaɗa tiitoonde.", "Ba rubutunka take."], "Donnez un titre au livre.": ["Give the book a title.", "أعطِ الكتاب عنوانًا.", "Hokku deftere tiitoonde.", "Ba littafin take."], "Supprimer ce commentaire ?": ["Delete this comment?", "حذف هذا التعليق؟", "Wila nehdi ndii?", "Share wannan sharhi?"], "Supprimer cette publication ?": ["Delete this post?", "حذف هذا المنشور؟", "Wila wurtinol ngol?", "Share wannan rubutu?"], "Supprimer ce live ?": ["Delete this live?", "حذف هذا البث؟", "Wila live ndii?", "Share wannan kai tsaye?"], "Supprimer ce chapitre ?": ["Delete this chapter?", "حذف هذا الفصل؟", "Wila fuɗɗoode ndee?", "Share wannan babi?"], "Supprimer ce groupe et toutes ses publications ?": ["Delete this group and all its posts?", "حذف هذه المجموعة وكل منشوراتها؟", "Wila gollotorde ndee e wurtinooje maaje fuu?", "Share wannan ƙungiya da duk rubuce-rubucenta?"], "Supprimer cette playlist ? Les contenus restent publiés.": ["Delete this playlist? The content stays published.", "حذف قائمة التشغيل هذه؟ يبقى المحتوى منشورًا.", "Wila playlist ndee? Kuuɗe ɗin ndaarii.", "Share wannan jerin sauraro? Abubuwan za su ci gaba da kasancewa."], "Supprimer ce livre et tous ses chapitres définitivement ?": ["Delete this book and all its chapters permanently?", "حذف هذا الكتاب وكل فصوله نهائيًا؟", "Wila deftere ndee e fuɗɗoode maade fuu foti?", "Share wannan littafi da duk babobinsa har abada?"], "Se déconnecter ? Il faudra vous reconnecter avec votre e-mail.": ["Log out? You'll need to log in again with your e-mail.", "تسجيل الخروج؟ ستحتاج لتسجيل الدخول مجددًا بالبريد الإلكتروني.", "Wurtu? A foti naatan fahin e e-mail maaɗa.", "Fita? Za ka buƙaci sake shiga da imel ɗinka."], "Envoyer la notification maintenan const DICO_IDX = { en: 0, ar: 1, ff: 2, ha: 3 };
function trad(fr) {
  if (langue === "fr" || typeof fr !== "string") return fr;
  const k = DICO_IDX[langue] != null ? DICO_IDX[langue] : 0;
  const d = DICO[fr];
  if (d && d[k]) return d[k];
  const s = fr.trim();
  if (!s) return fr;
  const e = DICO[s];
  if (e && e[k]) return fr.replace(s, e[k]);
  const m = s.match(/^([^\p{L}\p{N}]+)(.+)$/u);
  if (m) { const c = DICO[m[2]]; if (c && c[k]) return fr.replace(s, m[1] + c[k]); }
  return fr;
}

    const v = trad(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; return;
  }
  if (n.nodeType !== 1 || n.tagName === "SCRIPT" || n.tagName === "STYLE") return;
  if (n.closest && n.closest("[data-notrad]")) return;
  _TRAD_ATTR.forEach(a => { if (n.hasAttribute(a)) { const v = n.getAttribute(a), w = trad(v); if (w !== v) n.setAttribute(a, w); } });
  const tw = document.createTreeWalker(n, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let x;
  while ((x = tw.nextNode())) {
    if (x.nodeType === 3) { const p = x.parentElement; if (p && (p.tagName === "SCRIPT" || p.tagName === "STYLE" || p.closest("[data-notrad]"))) continue; const v = trad(x.nodeValue); if (v !== x.nodeValue) x.nodeValue = v; }
    else if (x.tagName !== "SCRIPT" && x.tagName !== "STYLE") _TRAD_ATTR.forEach(a => { if (x.hasAttribute(a)) { const v = x.getAttribute(a), w = trad(v); if (w !== v) x.setAttribute(a, w); } });

/* ---------- Partie Arabe : invocations et livres ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

async function chargerTout(table, colonnes, ordres) {
  const sortie = [], pas = 1000;
  for (let debut = 0; ; debut += pas) {
    let q = sb.from(table).select(colonnes);
    ordres.forEach(o => { q = q.order(o); });
    const { data, error } = await q.range(debut, debut + pas - 1);
    if (error) throw error;
    sortie.push(...data);
    if (data.length < pas) break;
  }
  return sortie;
}

async function donneesArabe(cle, table, colonnes, ordres) {
  try {
    const d = await chargerTout(table, colonnes, ordres);
    sauverLocal(cle, d);
    return d;
  } catch(e) {
    return chargerLocal(cle, []);
  }
}

function lireArabe(texte) {
  if (!('speechSynthesis' in window)) return;
  voix.arreter();
  const u = new SpeechSynthesisUtterance(texte);
  u.lang = "ar-SA";
  speechSynthesis.speak(u);
}

async function vueArabe() {
  let onglet = "duas", categorie = (etat.params && etat.params.categorie) || null;
  let duas = null, livres = null;
  const wrap = document.createElement("div");
  wrap.className = "ecran";

  function squelette() {
    wrap.innerHTML = `

      <button class="btn-outline" id="duas-audio" style="margin-bottom:10px">🎧 Invocations en audio (imams)</button>
      <div id="contenu" style="display:flex;flex-direction:column;gap:10px"></div>`;
    wrap.querySelector("#retour").onclick = () => { voix.arreter(); router("biblio"); };
    wrap.querySelector("#duas-audio").onclick = () => router("dossier", { cat: "Invocation", titre: "Invocations audio" });
  }

  async function afficher() {
    voix.arreter();
    squelette();
    const zone = wrap.querySelector("#contenu");
    zone.innerHTML = `<div class="centre"><div class="spinner"></div></div>`;
    if (onglet === "duas") {
      if (!duas) duas = await donneesArabe("cache_duas", "duas_arabe",

      listeDuas(zone);
    } else {
      if (!livres) livres = await donneesArabe("cache_livres", "livres_islamiques",
        "id,categorie,titre_ar,titre_fr,auteur_fr,deces_hijri,fichier_url", ["categorie", "id"]);
      listeLivres(zone);
    }
  }

  function listeDuas(zone) {
    if (!duas.length) { zone.innerHTML = `<div class="centre">${lumuSVG(96)}<p>Les invocations arrivent bientôt.</p></div>`; return; }
    const cats = [...new Set(duas.map(d => d.categorie))];
    const pq = sansAccent((etat.params && etat.params.q) || "").split(/\s+/).filter(x => x.length > 2);
    if (pq.length && !categorie) { const t = duas.find(d => pq.some(m => sansAccent(d.titre_fr + " " + d.categorie + " " + (d.traduction_fr || "")).includes(m))); if (t) categorie = t.categorie; }
    if (!categorie || !cats.includes(categorie)) categorie = cats[0];
    zone.innerHTML = `<div class="chips" id="chips"></div><div id="items" style="display:flex;flex-direction:column;gap:10px"></div>`;
    const chips = zone.querySelector("#chips");
    cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "chip" + (c === categorie ? " actif" : "");
      b.textContent = c;
      b.onclick = () => { categorie = c; voix.arreter(); listeDuas(zone); };
      chips.appendChild(b);
    });
    const items = zone.querySelector("#items");
    duas.filter(d => d.categorie === categorie).forEach(d => {
      const c = document.createElement("div");
      c.className = "carte";
      const trad = d.traduction_fr || d.traduction_en || "";
      c.innerHTML = `
        <b style="font-size:18px">${esc(d.titre_fr)}</b>
        <button class="btn btn-ecouter" data-ec="1">▶ ÉCOUTER</button>
        <div class="texte-arabe dua-ar" dir="rtl" lang="ar">${esc(d.texte_ar)}</div>
        ${trad ? `<div class="dua-fr">${esc(trad)}</div>` : ""}
        <div class="dua-ref"><span>📖 ${esc(d.reference)}${d.grade ? " · " + esc(LIBELLE_GRADE[d.grade] || d.grade) : ""}</span>
        <button class="btn-ecoute" aria-label="Écouter">🔊</button></div>`;
      c.querySelector(".btn-ecoute").onclick = c.querySelector(".btn-ecouter").onclick = () => lireArabe(d.texte_ar);
      items.appendChild(c);
    });
  }

  function listeLivres(zone) {
    if (!livres.length) { zone.innerHTML = `<div class="centre">${lumuSVG(96)}<p>Les livres arrivent bientôt.</p></div>`; return; }
    zone.innerHTML = "";
    let derniere = null;

      if (l.categorie !== derniere) {
        derniere = l.categorie;
        const h = document.createElement("h2");
        h.style.marginTop = "8px"; h.textContent = l.categorie;
        zone.appendChild(h);
      }

      c.className = "carte";
      const lien = l.fichier_url && /^https:\/\//.test(l.fichier_url)
        ? `<a class="lien-livre" href="${esc(l.fichier_url)}" target="_blank" rel="noopener">📖 Ouvrir le livre</a>`

      c.innerHTML = `
        <div class="texte-arabe livre-ar" dir="rtl" lang="ar">${esc(l.titre_ar)}</div>
        <b style="font-size:15px">${esc(l.titre_fr)}</b>

        ${lien}`;
      zone.appendChild(c);
    });
  }

  afficher();
}

function vueMotDePasseOublie() {
  let erreur = "", envoye = false, enCours = false, legacy = false;
  const wrap = document.createElement("div");
  wrap.className = "ecran centre";
  function dessiner() {
    wrap.innerHTML = `
      ${lumuSVG(96)}
      <h1>Code oublié</h1>
      ${envoye
        ? `<p style="margin-top:8px">${legacy
              ? "Si un compte existe avec cet e-mail, un lien de réinitialisation vient d'être envoyé. Vérifiez aussi vos spams."

           <button class="btn" id="retour" style="margin-top:16px">Retour à la connexion</button>`
        : `<p style="margin-top:8px">Entrez votre nom. Si vous avez donné un e-mail à l'inscription, on vous envoie un lien pour choisir un nouveau code. (Ancien compte : entrez votre e-mail.)</p>

           ${erreur ? `<p class="erreur">${esc(erreur)}</p>` : ""}

           <button class="btn-text" id="retour">Retour à la connexion</button>`
      }
    `;
    wrap.querySelector("#retour").onclick = () => router("connexion");
    const go = wrap.querySelector("#go");
    if (go) go.onclick = async () => {
      const ident = wrap.querySelector("#ident").value.trim();
      if (ident.length < 3) { erreur = "Entrez votre nom ou votre e-mail"; dessiner(); return; }
      enCours = true; erreur = ""; dessiner();
      try {
        const redirect = location.origin + location.pathname;
        if (ident.includes("@")) {
          legacy = true;
          await sb.auth.resetPasswordForEmail(ident, { redirectTo: redirect });
        } else {
          legacy = false;
          await appelAuth({ action: "oublie", nom: ident, redirect });
        }
        envoye = true;
      } catch(e) {
        erreur = messageErreur(e, "Envoi impossible, réessayez.");
      }
      enCours = false; dessiner();
    };
  }
  dessiner();
  app.appendChild(wrap);
}

async function vueDialogue() {
  const lecon = etat.params.lecon;
  const matiereId = etat.params.matiereId;
  const prononciation = chargerLocal("prononciation_" + etat.enfant.id, "");
  const modeEcriture = chargerLocal("mode_ecriture", "ardoise");

  let dialogueId = null, messages = [], enAttente = true, leconTerminee = false, ecritTableau = null;
  let tobiParle = false, enLigne = estEnLigne();

  const wrap = document.createElement("div");
  wrap.className = "ecran"; wrap.style.padding = "0"; wrap.style.gap = "0";
  app.appendChild(wrap);

  function tpl() {
    wrap.innerHTML = `
      ${!enLigne ? '<div class="bandeau-hors-ligne">Pas de connexion — Tobi ne peut pas continuer le cours en direct</div>' : ""}
      <div class="top-bar">
        <button class="btn-text" id="retour" style="padding:2px">←</button>

        <span style="width:24px"></span>

      </div>
      <div class="messages" id="messages"></div>
      <div id="saisie"></div>
    `;
    wrap.querySelector("#retour").onclick = () => router("lecons", { matiere: etat.matieres.find(m => m.id === matiereId) });
    dessinerTableau();
    dessinerMessages();
    dessinerSaisie();
  }

  function dessinerTableau() {
    const t = wrap.querySelector("#tableau");
    if (t) t.textContent = ecritTableau || "";
  }

  function dessinerMessages() {
    const m = wrap.querySelector("#messages");
    if (!m) return;
    m.innerHTML = "";
    messages.forEach(msg => {
      const estTobi = msg.role === "tobi";
      const ligne = document.createElement("div");
      ligne.className = "ligne-bulle " + (estTobi ? "tobi" : "enfant");
      if (estTobi) {
        const avatar = document.createElement("div");
        avatar.innerHTML = tobiSVG("idle", 30, true);
        ligne.appendChild(avatar.firstElementChild);
      }
      const b = document.createElement("div");
      b.className = "bulle " + (estTobi ? "tobi" : "enfant");
      b.textContent = msg.contenu;
      ligne.appendChild(b);
      m.appendChild(ligne);
    });
    if (enAttente) {
      const ligne = document.createElement("div");
      ligne.className = "ligne-bulle tobi";
      const avatar = document.createElement("div");
      avatar.innerHTML = tobiSVG("reflechit", 30, true);
      ligne.appendChild(avatar.firstElementChild);
      const b = document.createElement("div");
      b.className = "bulle tobi"; b.style.fontStyle = "italic"; b.textContent = "Tobi réfléchit…";
      ligne.appendChild(b);
      m.appendChild(ligne);
    }
    if (leconTerminee) {
      const fin = document.createElement("div");
      fin.className = "centre";
      fin.innerHTML = tobiSVG("celebre", 110);
      m.appendChild(fin);
    }
    m.scrollTop = m.scrollHeight + 500;
  }

  function dessinerSaisie() {
    const s = wrap.querySelector("#saisie");
    if (!s) return;
    if (leconTerminee) {
      s.innerHTML = `<p style="text-align:center;padding:20px;font-weight:600;color:var(--texte)">Leçon terminée, bravo ! 🎉</p>`;
      return;
    }
    if (modeEcriture === "ardoise") {
      s.innerHTML = `
        <div style="display:flex;justify-content:flex-end;padding:6px 12px"><button class="rond-bouton" id="micro">🎤</button></div>
        <div class="ardoise-cadre">
          <div class="ardoise-corps">
            <canvas class="ardoise-canvas" id="canvas"></canvas>
            <div class="outils-ardoise">
              <div class="outil actif" id="outil-craie">✏️</div>
              <div class="outil" id="outil-gomme">🧽</div>
              <div class="outil" id="outil-effacer">🗑️</div>
            </div>
          </div>
          <button class="bouton-montrer" id="montrer">Montrer à Tobi</button>
        </div>
        <div style="height:12px"></div>
      `;
      initArdoise();
    } else {
      s.innerHTML = `
        <div class="barre-saisie">
          <input class="champ-saisie" id="texte" placeholder="Écris ta réponse…" ${enAttente || !enLigne ? "disabled" : ""}>
          <button class="rond-bouton" id="envoyer" ${enAttente || !enLigne ? "disabled" : ""}>➤</button>
          <button class="rond-bouton" id="micro" ${enAttente || !enLigne ? "disabled" : ""}>🎤</button>
        </div>
      `;
      wrap.querySelector("#envoyer").onclick = () => {
        const v = wrap.querySelector("#texte").value.trim();
        if (v) envoyerReponse(v, "texte");
      };
      wrap.querySelector("#texte").onkeydown = (e) => { if (e.key === "Enter") wrap.querySelector("#envoyer").click(); };
    }
    const micro = wrap.querySelector("#micro");
    if (micro) micro.onclick = () => lancerMicro();
  }

  function lancerMicro() {
    const r = creerReconnaisseur();
    if (!r) { alert("Micro non disponible sur ce navigateur."); return; }
    r.onresult = (ev) => { const texte = ev.results[0][0].transcript; envoyerReponse(texte, "audio"); };
    r.onerror = () => {};
    try { r.start(); } catch(e) {}
  }

  let ctx, dessin = false, modeGomme = false, dernierPoint = null;
  function initArdoise() {
    const canvas = wrap.querySelector("#canvas");
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = (rect.width - 46) * 2; canvas.height = 260;
    canvas.style.width = (rect.width - 46) + "px"; canvas.style.height = "130px";
    ctx = canvas.getContext("2d");
    ctx.scale(2,1);
    ctx.strokeStyle = "#F5F2E8"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left), y: (t.clientY - r.top) };
    }
    function debut(e) { e.preventDefault(); dessin = true; dernierPoint = pos(e); }
    function bouger(e) {
      if (!dessin) return; e.preventDefault();
      const p = pos(e);
      if (modeGomme) { ctx.clearRect(p.x-15, p.y-15, 30, 30); }
      else { ctx.beginPath(); ctx.moveTo(dernierPoint.x, dernierPoint.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      dernierPoint = p;
    }
    function fin(e) { dessin = false; }
    canvas.addEventListener("mousedown", debut); canvas.addEventListener("mousemove", bouger); window.addEventListener("mouseup", fin);
    canvas.addEventListener("touchstart", debut, {passive:false}); canvas.addEventListener("touchmove", bouger, {passive:false}); canvas.addEventListener("touchend", fin);

    wrap.querySelector("#outil-craie").onclick = () => { modeGomme = false; wrap.querySelector("#outil-craie").classList.add("actif"); wrap.querySelector("#outil-gomme").classList.remove("actif"); };
    wrap.querySelector("#outil-gomme").onclick = () => { modeGomme = true; wrap.querySelector("#outil-gomme").classList.add("actif"); wrap.querySelector("#outil-craie").classList.remove("actif"); };
    wrap.querySelector("#outil-effacer").onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
    wrap.querySelector("#montrer").onclick = () => envoyerArdoise(canvas);
  }

  async function envoyerArdoise(canvas) {
    const bouton = wrap.querySelector("#montrer");
    bouton.disabled = true; bouton.textContent = "Tobi lit…";
    const base64 = canvas.toDataURL("image/png").split(",")[1];
    try {
      const r = await appelFonction("lire-ardoise", { image_base64: base64, contexte: ecritTableau || lecon.titre });
      const res = await r.json();
      if (res.lecture) {
        const msg = res.alternatives && res.alternatives.length
          ? `${res.lecture} [écrit à la main, autres lectures possibles : ${res.alternatives.join(" / ")}]`
          : res.lecture;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        envoyerReponse(msg, "ardoise");
      } else {
        bouton.disabled = false; bouton.textContent = "Montrer à Tobi";
        alert("Je n'ai pas bien vu, réessaie !");
      }
    } catch(e) { bouton.disabled = false; bouton.textContent = "Montrer à Tobi"; }
  }

  async function envoyerReponse(texte, type) {
    messages.push({ role: "enfant", contenu: texte });
    dessinerMessages();
    await tourAvecFlux(texte, type);
  }

  async function tourAvecFlux(messageEnfant, type) {
    enAttente = true; tpl();
    let indexBulle = -1;
    voix.arreter();
    if (messageEnfant) voix.ajouter(["Hmm…","Voyons voir…","Alors…","D'accord…"][Math.floor(Math.random()*4)]);

    try {
      const historique = messages.map(m => ({ role: m.role, contenu: m.contenu }));
      const r = await appelFonction("dialoguer", {
        titre_lecon: lecon.titre, contenu_texte: lecon.contenu_texte || "",
        historique, message_enfant: messageEnfant, prenom_enfant: etat.enfant.prenom,
        profil_alignement: null, evenement: null
      });
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let tampon = "", metaLigne = null, texteComplet = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        tampon += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = tampon.indexOf("\n")) >= 0) {
          const ligne = tampon.slice(0, idx).trim(); tampon = tampon.slice(idx+1);
          if (!ligne) continue;
          if (ligne.startsWith("§§") || (ligne.startsWith("{") && ligne.includes("message_tobi"))) {
            metaLigne = ligne; continue;
          }
          texteComplet += (texteComplet ? " " : "") + ligne;
          enAttente = false;
          if (indexBulle < 0) { messages.push({ role: "tobi", contenu: ligne }); indexBulle = messages.length - 1; }
          else { messages[indexBulle].contenu += " " + ligne; }
          dessinerMessages();
          voix.ajouter(ligne);
        }
      }
      let meta = {};
      if (metaLigne) {
        try {
          if (metaLigne.startsWith("§§")) meta = JSON.parse(metaLigne.slice(2));
          else { const anc = JSON.parse(metaLigne); meta = anc; if (!texteComplet) { messages.push({role:"tobi",contenu:anc.message_tobi}); voix.ajouter(anc.message_tobi); } }
        } catch(e) {}
      }
      if (meta.ecrit_au_tableau) ecritTableau = meta.ecrit_au_tableau;
      leconTerminee = !!meta.lecon_terminee;
      dessinerTableau();
    } catch(e) {
      messages.push({ role: "tobi", contenu: `Oups, la connexion a coupé. Tu peux répéter, ${etat.enfant.prenom} ?` });
    }
    enAttente = false;
    tpl();
  }

  tpl();
  try {
    const { data, error } = await sb.from("dialogues").insert({ enfant_id: etat.enfant.id, lecon_id: lecon.id }).select().single();
    if (error) throw error;
    dialogueId = data.id;
    await tourAvecFlux(null, null);
  } catch(e) {
    enAttente = false;
    messages.push({ role: "tobi", contenu: "Je n'arrive pas à me connecter. Vérifie ta connexion et reviens." });
    tpl();
  }

  window.addEventListener("online", () => { enLigne = true; tpl(); });
  window.addEventListener("offline", () => { enLigne = false; tpl(); });
}

window.addEventListener("offline", () => { if (!document.getElementById("bandeau-net")) { const b = document.createElement("div"); b.id = "bandeau-net"; b.className = "bandeau-hors-ligne"; b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:50"; b.textContent = "Hors ligne — certaines fonctions sont indisponibles"; document.body.appendChild(b); } });
window.addEventListener("online", () => { const b = document.getElementById("bandeau-net"); if (b) b.remove(); });
init();
</script>
