name: Chercher un récitateur
on:
  push:
    paths:
      - "import-coran/chercher.json"
      - "import-coran/timings.mjs"
permissions:
  contents: write
jobs:
  chercher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node import-coran/timings.mjs
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add import-coran/resultat-timings.txt
          git commit -m "Résultat de recherche de récitateur [skip ci]" && git pull --rebase -q && git push -q || true
