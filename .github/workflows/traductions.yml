name: Traductions du Coran (QuranEnc)
on:
  schedule:
    - cron: "23 4 2 * *"
  workflow_dispatch:
  push:
    paths:
      - "import-coran/traductions.mjs"
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node import-coran/traductions.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coran/trad
          git commit -m "Traductions du Coran : mise à jour QuranEnc [skip ci]" && git pull --rebase -q && git push -q || true
