name: Sonde des directs La Mecque / Médine
on:
  push:
    paths:
      - "sonde-direct/sonde.mjs"
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node sonde-direct/sonde.mjs
      - name: Enregistrer le résultat
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonde-direct/resultat.txt
          git commit -m "Sonde des directs [skip ci]" && git pull --rebase -q && git push -q || true
