name: Directs La Mecque / Médine
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "sonde-direct/directs.mjs"
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node sonde-direct/directs.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maj/directs.json maj/radios.json
          git commit -m "Directs : identifiants à jour [skip ci]" && git pull --rebase -q && git push -q || true
