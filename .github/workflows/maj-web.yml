name: Publier la mise à jour de l'interface
on:
  push:
    branches: [main]
    paths:
      - "app/src/app/assets/**"
      - "maj/natif_min"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maj-web
  cancel-in-progress: false
jobs:
  manifeste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Écrire maj/web.json
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          d = "app/src/app/assets"
          v = int(re.search(r'lumu-v(\d+)', open(d + "/sw.js").read()).group(1))
          f = {n: hashlib.sha256(open(os.path.join(d, n), "rb").read()).hexdigest() for n in sorted(os.listdir(d)) if os.path.isfile(os.path.join(d, n)) and re.match(r'^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$', n)}
          natif = int(open("maj/natif_min").read().strip() or 1)
          json.dump({"v": v, "commit": os.environ["GITHUB_SHA"], "natif_min": natif, "fichiers": f}, open("maj/web.json", "w"), indent=1)
          print(v, len(f), "fichiers")
          PY
      - name: Préchauffer jsDelivr et vérifier les empreintes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          m = json.load(open("maj/web.json")); bad = 0
          for n, h in m["fichiers"].items():
              u = f"https://cdn.jsdelivr.net/gh/{os.environ['GITHUB_REPOSITORY']}@{m['commit']}/app/src/app/assets/{n}"
              for i in range(3):
                  try: b = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "LumuMaj/1.0"}), timeout=60).read(); break
                  except Exception as e: b = b""; print("  essai", i + 1, n, e); time.sleep(5 * (i + 1))
              ok = hashlib.sha256(b).hexdigest() == h
              bad += not ok
              print("OK " if ok else "ÉCART", n, len(b))
          if bad: raise SystemExit(f"{bad} fichier(s) différent(s) sur jsDelivr")
          PY
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maj/web.json
          git commit -m "Mise à jour de l'interface publiée [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
