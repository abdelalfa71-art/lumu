name: Catalogue IslamHouse
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "import-coran/islamhouse.mjs"
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: node import-coran/islamhouse.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maj/islamhouse
          git commit -m "Catalogue IslamHouse : mise à jour [skip ci]" && git pull --rebase -q && git push -q || true
