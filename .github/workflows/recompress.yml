name: Alléger les audios
on:
  push:
    paths:
      - "recompress/mode.txt"
permissions:
  id-token: write
  contents: read
jobs:
  alleger:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ffmpeg -version | head -1
      - run: npm install --no-save @supabase/supabase-js@2
      - name: Convertir
        run: |
          set +e
          node recompress/run.mjs > sortie.txt 2>&1; code=$?
          echo "::error::sortie: $(tail -c 700 sortie.txt | tr '\n' '|')"
          exit $code
