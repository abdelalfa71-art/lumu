name: Fabriquer les APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Clé de signature Lumu
        env:
          PHRASE: ${{ secrets.LUMU_SIGNATURE }}
        run: |
          if [ -n "$PHRASE" ]; then
            mkdir -p "$RUNNER_TEMP/sig" && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PHRASE -in signature/lumu.tar.enc | tar -C "$RUNNER_TEMP/sig" -xf -
            echo "LUMU_KS=$RUNNER_TEMP/sig/lumu.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$(cat $RUNNER_TEMP/sig/kp.txt)"
            echo "LUMU_KS_PASS=$(cat $RUNNER_TEMP/sig/kp.txt)" >> "$GITHUB_ENV"
          else echo "Pas de clé : signature temporaire"; fi
      - name: Compiler
        run: gradle assembleAppDebug assembleAdminDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Lumu-APK
          path: app/build/outputs/apk/**/*.apk
